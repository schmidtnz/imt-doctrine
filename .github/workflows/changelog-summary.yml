name: Changelog summary

# Each pull request ends with a "Changelog summary" section; Prepare release copies it into the
# changelog. Runs again when the description is edited, so a reviewer's rewording is checked too.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: changelog-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --no-dev
      # Bots' pull requests, including release PRs, have no summary.
      - env:
          PR_BODY: ${{ github.event.pull_request.body }}
          SKIP: ${{ github.event.pull_request.user.type == 'Bot' }}
        run: |
          if [ "$SKIP" = true ]; then echo "Nothing to check."; exit 0; fi
          uv run python tools/release.py summary
