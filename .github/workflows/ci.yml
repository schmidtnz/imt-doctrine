name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Prepare release dispatches this on the release branch, whose pull request can't trigger it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Traceability check
        run: |
          base=""
          if [ "${{ github.event_name }}" = pull_request ]; then base="--base origin/${{ github.base_ref }}"; fi
          status=0
          python tools/doctrace.py --root docs $base --report trace-report.md || status=$?
          cat trace-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Changelog check
        run: python tools/release.py check
      - name: Build site
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v6
        with:
          name: site
          path: docs/_build/html

  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/latex
      - run: sphinx-build -M latexpdf docs docs/_build
      - uses: actions/upload-artifact@v6
        with:
          name: pdf
          path: docs/_build/latex/imt-doctrine.pdf

  # Checks the built HTML, where cross-references and glossary terms have become real links.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sphinx-build -b html docs docs/_build/html
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --root-dir "${{ github.workspace }}/docs/_build/html" 'docs/_build/html/**/*.html' README.md CONTRIBUTING.md
