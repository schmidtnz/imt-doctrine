name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Traceability check
        run: |
          base=""
          if [ "${{ github.event_name }}" = pull_request ]; then base="--base origin/${{ github.base_ref }}"; fi
          status=0
          python tools/doctrace.py --root docs $base --report trace-report.md || status=$?
          cat trace-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Build site
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs/_build/html

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress 'docs/**/*.md' README.md CONTRIBUTING.md
