name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - name: Unit tests
        run: uv run pytest -q
      - name: Traceability check
        run: |
          base=""
          if [ "${{ github.event_name }}" = pull_request ]; then base="--base origin/${{ github.base_ref }}"; fi
          status=0
          uv run python tools/doctrace.py --root docs $base --report trace-report.md || status=$?
          cat trace-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Changelog check
        run: uv run python tools/release.py check
      - name: Build site
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs/_build/html

  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - uses: ./.github/actions/latex
      - run: uv run sphinx-build -M latexpdf docs docs/_build
      - uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: docs/_build/latex/imt-doctrine.pdf
