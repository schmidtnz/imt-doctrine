name: CI

# Builds once per commit: pull requests also check links, main also publishes to next/ on the site.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; main runs one at a time, newest queued last.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - name: Unit tests
        run: uv run pytest -q
      - name: Traceability check
        run: |
          base=""
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="--base origin/${{ github.base_ref }} --comment trace-comment.md"
          fi
          status=0
          uv run python tools/doctrace.py --root docs $base --report trace-report.md || status=$?
          cat trace-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # PR preview posts this as the pull request's Traceability comment, even when the check fails.
      - if: always() && hashFiles('trace-comment.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: traceability
          path: trace-comment.md
      - name: Changelog check
        run: uv run python tools/release.py check
      - name: Build site
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs/_build/html

  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-dev
      - uses: ./.github/actions/latex
      - run: uv run sphinx-build -M latexpdf docs docs/_build
      - uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: docs/_build/latex/imt-doctrine.pdf

  # main is checked weekly instead (links.yml).
  links:
    if: github.event_name == 'pull_request'
    needs: build
    uses: ./.github/workflows/links.yml
    with:
      site: true

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [build, pdf]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-dev
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: docs/_build/html
      - uses: actions/download-artifact@v8
        with:
          name: pdf
          path: docs/_build/html
      # Data for the README's traceability badge (shields.io endpoint).
      - run: uv run python tools/doctrace.py --root docs --badge docs/_build/html/traceability.json
      # main is the working draft, at next/.
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs/_build/html
          branch: gh-pages
          target-folder: next
          force: false
      # Root: versions.json for the version menu, and redirects to latest/ (next/ before the first
      # release). Release folders and previews are left alone.
      - run: |
          git fetch -q origin gh-pages
          uv run python tools/site_index.py root --out _root
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: _root
          branch: gh-pages
          clean-exclude: |
            next/
            latest/
            v*/
            pr-preview/
          force: false
