name: Links

# CI runs this for pull requests on the site it built; main is checked weekly, because external
# links break without anyone touching the repository.
on:
  workflow_call:
    inputs:
      site:
        description: Use the calling run's site artifact instead of building
        type: boolean
        default: false
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Checks the built HTML, where cross-references and glossary terms have become real links.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: inputs.site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: docs/_build/html
      - if: ${{ !inputs.site }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - if: ${{ !inputs.site }}
        run: |
          uv sync --locked --no-dev
          uv run sphinx-build -b html docs docs/_build/html
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --root-dir "${{ github.workspace }}/docs/_build/html" 'docs/_build/html/**/*.html' README.md CONTRIBUTING.md
