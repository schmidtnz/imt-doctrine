name: Links

# Also runs weekly, because external links break without anyone touching the repository.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Checks the built HTML, where cross-references and glossary terms have become real links.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sphinx-build -b html docs docs/_build/html
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --root-dir "${{ github.workspace }}/docs/_build/html" 'docs/_build/html/**/*.html' README.md CONTRIBUTING.md
