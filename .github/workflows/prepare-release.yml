name: Prepare release

# Opens or refreshes the "Release vX.Y.Z" pull request. The version comes from item changes since
# the last release; the changelog section from merged pull requests' changelog summaries.
# Merging that pull request publishes the release (release.yml).
# After each other merge to main it runs by itself: it keeps the open release pull request's
# channel and bump, or opens one on the RELEASE_CHANNEL variable's channel (default demo) when
# there is something for the changelog.
on:
  push:
    branches: [main]
    # Merging the release pull request itself changes only these.
    paths-ignore: [docs/changelog.md, docs/contributors.md]
  workflow_dispatch:
    inputs:
      channel:
        description: final, rc (release candidate for consultation) or demo
        type: choice
        options: [final, rc, demo]
        default: final
      bump:
        description: auto works it out from item changes; pick a level only to go higher
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      auto:
        description: Run as after a merge (keep the open release pull request; skip if nothing to release)
        type: boolean
        default: false

# The release app opens the pull request, so its checks run and Actions can't approve PRs.
permissions:
  contents: read
  pull-requests: read

concurrency: prepare-release

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the release app is set up
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error::Set the RELEASE_APP_CLIENT_ID variable and RELEASE_APP_KEY secret: see README, First-time setup."
            exit 1
          fi
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-dev
      - id: prepare
        env:
          AUTO: ${{ github.event_name == 'push' || inputs.auto }}
          AUTO_CHANNEL: ${{ vars.RELEASE_CHANNEL || 'demo' }}
          CHANNEL: ${{ inputs.channel }}
          BUMP: ${{ inputs.bump || 'auto' }}
          TZ: Pacific/Auckland  # NZ changelog dates
        run: |
          args=(--bump "$BUMP" --body "$RUNNER_TEMP/body.md")
          if [ "$AUTO" = true ]; then
            args+=(--channel "$AUTO_CHANNEL" --skip-empty)
            open=$(gh pr list --head release/next --state open --json title --jq '.[0].title // ""')
            [ -z "$open" ] || args+=(--keep "${open#Release }")
          else
            args+=(--channel "$CHANNEL")
          fi
          uv run python tools/release.py prepare "${args[@]}"
      - name: Open release pull request
        if: steps.prepare.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "$BOT"
          git config user.email "$(gh api "users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git switch -C release/next
          git add docs/changelog.md docs/contributors.md
          git commit -qm "chore: release $VERSION"
          git push -f origin release/next
          pr=$(gh pr list --head release/next --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "Release $VERSION" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head release/next --base main --title "Release $VERSION" --body-file "$RUNNER_TEMP/body.md"
          fi
