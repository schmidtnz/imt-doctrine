name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python tools/doctrace.py --root docs
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: ./.github/actions/latex
      - run: |
          sphinx-build -M latexpdf docs docs/_build
          cp docs/_build/latex/imt-doctrine.pdf docs/_build/html/
      # Keeps PR previews in pr-preview/ when the main site is replaced.
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs/_build/html
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
