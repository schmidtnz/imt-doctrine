name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python tools/doctrace.py --root docs
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
      # Data for the README's traceability badge (shields.io endpoint).
      - run: uv run python tools/doctrace.py --root docs --badge docs/_build/html/traceability.json
      - uses: ./.github/actions/latex
      - run: |
          uv run sphinx-build -M latexpdf docs docs/_build
          cp docs/_build/latex/imt-doctrine.pdf docs/_build/html/
      # main is the working draft, at next/.
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs/_build/html
          branch: gh-pages
          target-folder: next
          force: false
      # Root: versions.json for the version menu, and redirects to latest/ (next/ before the first
      # release). Release folders and previews are left alone.
      - run: |
          git fetch -q origin gh-pages
          uv run python tools/site_index.py root --out _root
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: _root
          branch: gh-pages
          clean-exclude: |
            next/
            latest/
            v*/
            pr-preview/
          force: false
