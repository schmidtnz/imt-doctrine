name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python tools/doctrace.py --root docs
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: ./.github/actions/latex
      - run: |
          uv run sphinx-build -M latexpdf docs docs/_build
          cp docs/_build/latex/imt-doctrine.pdf docs/_build/html/
      # Keeps PR previews in pr-preview/ when the main site is replaced.
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs/_build/html
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
