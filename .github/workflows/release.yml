name: Release

# Publishes the newest changelog version once it reaches main (normally by merging the release
# pull request): builds the site and PDF, then creates the tag and GitHub release in one step.
# Does nothing when the newest changelog version is already tagged.
on:
  push:
    branches: [main]
    paths: [docs/changelog.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pending:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pending.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-dev
      - id: pending
        run: uv run python tools/release.py pending

  release:
    needs: pending
    if: needs.pending.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      attestations: write
      contents: read
      id-token: write
    env:
      DOCS_VERSION: ${{ needs.pending.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-dev
      - uses: ./.github/actions/latex
      - run: |
          uv run sphinx-build -W --keep-going -b html docs docs/_build/html
          uv run python tools/doctrace.py --root docs --badge docs/_build/html/traceability.json
      - run: uv run sphinx-build -M latexpdf docs docs/_build
      # imt-doctrine.pdf keeps one name across releases, so
      # https://github.com/<repo>/releases/latest/download/imt-doctrine.pdf always gets the latest final.
      - name: Package
        run: |
          mkdir dist
          cp docs/_build/latex/imt-doctrine.pdf "dist/imt-doctrine-${DOCS_VERSION}.pdf"
          cp docs/_build/latex/imt-doctrine.pdf dist/imt-doctrine.pdf
          cp docs/_build/latex/imt-doctrine.pdf docs/_build/html/
          (cd docs/_build/html && zip -qr "$GITHUB_WORKSPACE/dist/imt-doctrine-${DOCS_VERSION}-html.zip" .)
          (cd dist && sha256sum -- * > SHA256SUMS)
      # Lets anyone check a PDF came from this repository's release build. Needs a public repository.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      # Tags are created as the release app, the only non-admin the tag ruleset allows.
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
      - name: Create release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          uv run python tools/release.py notes "$DOCS_VERSION" > notes.md
          flags=""
          case "$DOCS_VERSION" in *-*) flags="--prerelease";; esac
          # Draft first so the release is complete (and immutable, if enabled) before anyone sees it.
          gh release create "$DOCS_VERSION" dist/* --draft --target "$GITHUB_SHA" \
            --title "IMT Doctrine $DOCS_VERSION" --notes-file notes.md $flags
          gh release edit "$DOCS_VERSION" --draft=false
      # The release keeps its own folder on the site. latest/ shows the newest final release, or the
      # newest of any kind until there is one.
      - id: site
        run: |
          git fetch -q origin gh-pages || true
          echo "latest=$(uv run python tools/site_index.py is-latest "$DOCS_VERSION")" >> "$GITHUB_OUTPUT"
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs/_build/html
          branch: gh-pages
          target-folder: ${{ env.DOCS_VERSION }}
          token: ${{ steps.app.outputs.token }}
          force: false
      - if: steps.site.outputs.latest == 'true'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs/_build/html
          branch: gh-pages
          target-folder: latest
          token: ${{ steps.app.outputs.token }}
          force: false
      # Rebuild next/ and the site root (version list) now the tag exists, and open the next release
      # pull request if anything merged while this release was being built.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref main
          gh workflow run prepare-release.yml --ref main -f auto=true
