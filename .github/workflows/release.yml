name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      DOCS_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk xindy texlive-xetex \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended fonts-freefont-otf
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - run: sphinx-build -M latexpdf docs docs/_build
      - name: Package
        run: |
          cp docs/_build/latex/imt-doctrine.pdf "imt-doctrine-${DOCS_VERSION}.pdf"
          (cd docs/_build/html && zip -qr "$GITHUB_WORKSPACE/imt-doctrine-${DOCS_VERSION}-html.zip" .)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$DOCS_VERSION" in *-*) flags="--prerelease";; esac
          gh release create "$DOCS_VERSION" imt-doctrine-*.pdf imt-doctrine-*-html.zip \
            --title "IMT Doctrine $DOCS_VERSION" --notes-file docs/changelog.md --verify-tag $flags
