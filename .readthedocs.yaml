# Read the Docs trial, alongside GitHub Pages; its pull request builds are HTML only.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # rsvg-convert turns SVG figures into PDF; FreeFont is xelatex's default font.
  apt_packages:
    - librsvg2-bin
    - fonts-freefont-otf
  jobs:
    # Full history and tags, so conf.py's git describe finds the release tag.
    post_checkout:
      - git fetch --unshallow || true
      - git fetch --tags || true
    # Keep search engines off the trial site; GitHub Pages is unaffected.
    post_build:
      - >-
        printf 'User-agent: *\nDisallow: /\n' > "$READTHEDOCS_OUTPUT/html/robots.txt"

python:
  install:
    - method: uv
      command: sync

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf
