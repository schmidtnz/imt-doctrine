<svg xmlns="http://www.w3.org/2000/svg" width="800" height="372" viewBox="0 0 800 372" role="img" aria-labelledby="title desc">
  <title id="title">The extended search planning cycle</title>
  <desc id="desc">Steps 1 to 7 set up the search: review the initial response, determine the search area, develop scenarios, mark regions on the map, weight the regions, divide them into segments and weight the segments. Steps 8 to 11 then repeat as a loop: task to the highest-weighted segments, debrief teams to establish POD, recalculate segment weights from POD and new intelligence, and re-task to the next highest regions or segments.</desc>
  <style>
    text { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, FreeSans, sans-serif; fill: #1f2933; }
    .step { font-size: 15px; }
    .num { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .name { font-size: 15px; font-weight: 600; }
    .note { font-size: 12.5px; fill: #52606d; }
    .loop { fill: none; stroke: #d9480f; stroke-width: 2.5; }
    .node { fill: #fff0e6; stroke: #d9480f; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
    <marker id="entry" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1864ab"/>
    </marker>
  </defs>
  <rect width="800" height="372" rx="12" fill="#ffffff"/>

  <!-- Steps 1-7, once -->
  <line x1="40" y1="40" x2="40" y2="328" stroke="#9aa5b1" stroke-width="2"/>
  <g fill="#1864ab">
    <circle cx="40" cy="40" r="14"/>
    <circle cx="40" cy="88" r="14"/>
    <circle cx="40" cy="136" r="14"/>
    <circle cx="40" cy="184" r="14"/>
    <circle cx="40" cy="232" r="14"/>
    <circle cx="40" cy="280" r="14"/>
    <circle cx="40" cy="328" r="14"/>
  </g>
  <g text-anchor="middle">
    <text class="num" x="40" y="45">1</text>
    <text class="num" x="40" y="93">2</text>
    <text class="num" x="40" y="141">3</text>
    <text class="num" x="40" y="189">4</text>
    <text class="num" x="40" y="237">5</text>
    <text class="num" x="40" y="285">6</text>
    <text class="num" x="40" y="333">7</text>
  </g>
  <text class="step" x="64" y="45">Review the initial response</text>
  <text class="step" x="64" y="93">Determine the search area</text>
  <text class="step" x="64" y="141">Develop scenarios</text>
  <text class="step" x="64" y="189">Mark regions on the map</text>
  <text class="step" x="64" y="237">Weight the regions</text>
  <text class="step" x="64" y="285">Divide into segments</text>
  <text class="step" x="64" y="333">Weight the segments</text>

  <path d="M 228 328 H 316 Q 330 328 330 314 V 219 Q 330 205 344 205 H 353" fill="none" stroke="#1864ab" stroke-width="2.5" marker-end="url(#entry)"/>

  <!-- Steps 8-11, repeated -->
  <path class="loop" d="M 445.7 172.8 A 130 110 0 0 1 478.1 127.2" marker-end="url(#arrow)"/>
  <path class="loop" d="M 661.9 127.2 A 130 110 0 0 1 694.3 172.8" marker-end="url(#arrow)"/>
  <path class="loop" d="M 694.3 237.2 A 130 110 0 0 1 661.9 282.8" marker-end="url(#arrow)"/>
  <path class="loop" d="M 478.1 282.8 A 130 110 0 0 1 445.7 237.2" marker-end="url(#arrow)"/>

  <rect class="node" x="355" y="173" width="170" height="64" rx="10"/>
  <text class="name" x="440" y="200" text-anchor="middle">8  Task</text>
  <text class="note" x="440" y="219" text-anchor="middle">highest-weighted segments</text>

  <rect class="node" x="485" y="63" width="170" height="64" rx="10"/>
  <text class="name" x="570" y="90" text-anchor="middle">9  Debrief teams</text>
  <text class="note" x="570" y="109" text-anchor="middle">to establish POD</text>

  <rect class="node" x="615" y="173" width="170" height="64" rx="10"/>
  <text class="name" x="700" y="193" text-anchor="middle">10  Recalculate</text>
  <text class="note" x="700" y="211" text-anchor="middle">segment weights from POD</text>
  <text class="note" x="700" y="227" text-anchor="middle">and new intelligence</text>

  <rect class="node" x="485" y="283" width="170" height="64" rx="10"/>
  <text class="name" x="570" y="303" text-anchor="middle">11  Re-task</text>
  <text class="note" x="570" y="321" text-anchor="middle">next highest regions</text>
  <text class="note" x="570" y="337" text-anchor="middle">or segments</text>

  <text class="name" x="570" y="201" text-anchor="middle" style="fill: #52606d">Repeat</text>
  <text class="note" x="570" y="219" text-anchor="middle">steps 8–11</text>
</svg>
