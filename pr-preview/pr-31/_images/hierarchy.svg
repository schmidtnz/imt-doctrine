<svg xmlns="http://www.w3.org/2000/svg" width="800" height="422" viewBox="0 0 800 422" role="img" aria-labelledby="title desc">
  <title id="title">Levels of the doctrine</title>
  <desc id="desc">Five stacked levels: principles, concepts, guidelines, processes and forms, each deriving from the one above. Principles and concepts are the doctrine tier; guidelines, processes and forms are the guidance tier. A dashed arrow from forms back up to principles shows double-loop learning.</desc>
  <style>
    text { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, FreeSans, sans-serif; fill: #1f2933; }
    .name { font-size: 17px; font-weight: 600; }
    .id { font-family: Consolas, "DejaVu Sans Mono", FreeMono, monospace; font-size: 14px; fill: #52606d; }
    .tier { font-size: 15px; font-weight: 600; }
    .note { font-size: 13.5px; fill: #52606d; }
    .doctrine { fill: #fff0e6; stroke: #d9480f; stroke-width: 1.5; }
    .guidance { fill: #e7f1fb; stroke: #1864ab; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="800" height="422" rx="12" fill="#ffffff"/>

  <rect class="doctrine" x="230" y="28" width="340" height="54" rx="8"/>
  <text class="name" x="252" y="61">Principles</text>
  <text class="id" x="548" y="60" text-anchor="end">PRN</text>

  <rect class="doctrine" x="230" y="106" width="340" height="54" rx="8"/>
  <text class="name" x="252" y="139">Concepts</text>
  <text class="id" x="548" y="138" text-anchor="end">CON</text>

  <rect class="guidance" x="230" y="184" width="340" height="54" rx="8"/>
  <text class="name" x="252" y="217">Guidelines</text>
  <text class="id" x="548" y="216" text-anchor="end">GDL</text>

  <rect class="guidance" x="230" y="262" width="340" height="54" rx="8"/>
  <text class="name" x="252" y="295">Processes</text>
  <text class="id" x="548" y="294" text-anchor="end">PRC</text>

  <rect class="guidance" x="230" y="340" width="340" height="54" rx="8"/>
  <text class="name" x="252" y="373">Forms</text>
  <text class="id" x="548" y="372" text-anchor="end">FRM</text>

  <g stroke="#52606d" stroke-width="2" marker-end="url(#down)">
    <line x1="400" y1="84" x2="400" y2="104"/>
    <line x1="400" y1="162" x2="400" y2="182"/>
    <line x1="400" y1="240" x2="400" y2="260"/>
    <line x1="400" y1="318" x2="400" y2="338"/>
  </g>

  <path d="M 218 30 H 210 V 158 H 218" fill="none" stroke="#d9480f" stroke-width="2"/>
  <text class="tier" x="198" y="80" text-anchor="end">Doctrine tier</text>
  <text class="note" x="198" y="99" text-anchor="end">doctrine owners</text>
  <text class="note" x="198" y="116" text-anchor="end">approve</text>

  <path d="M 218 186 H 210 V 392 H 218" fill="none" stroke="#1864ab" stroke-width="2"/>
  <text class="tier" x="198" y="275" text-anchor="end">Guidance tier</text>
  <text class="note" x="198" y="294" text-anchor="end">any reviewer</text>
  <text class="note" x="198" y="311" text-anchor="end">approves</text>

  <path d="M 573 367 C 690 367, 690 55, 576 55" fill="none" stroke="#52606d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#down)"/>
  <text class="tier" x="678" y="178">Double-loop</text>
  <text class="tier" x="678" y="196">learning</text>
  <text class="note" x="678" y="218">Lessons from</text>
  <text class="note" x="678" y="236">operations</text>
  <text class="note" x="678" y="254">feed back up</text>
</svg>
